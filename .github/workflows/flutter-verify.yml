name: Mo Save — Flutter verification
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-save-ms18-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - name: Flutter environment
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart source and tests
        run: flutter analyze --no-fatal-infos
      - name: Run all deterministic unit and widget tests
        if: always()
        run: flutter test --reporter expanded

  android-apk:
    name: Build private distribution APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build a release-mode APK
        run: flutter build apk --release
      - name: Preserve APK for manual installation and client QA
        uses: actions/upload-artifact@v4
        with:
          name: mo-save-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
